<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sāgarasaṅgama</title>
  <meta name="description" content="A virtual meeting of oceans for large online Sanskrit e-text collections." />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <!-- Preload the three subsets this page renders: the wordmark's Latin (with
       its IAST diacritics, hence latin-ext) and the Devanagari line. Fetched
       in parallel with styles.css instead of waiting for it to be parsed, so
       the face is usually there at first paint. crossorigin is required even
       same-origin: font requests are CORS, and without it the preload is
       ignored and refetched. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="./assets/fonts/tiro-devanagari-sanskrit-latin.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="./assets/fonts/tiro-devanagari-sanskrit-latin-ext.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="./assets/fonts/tiro-devanagari-sanskrit-devanagari.woff2" />
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // Set before first paint, or the page flashes the wrong theme. Light is
    // the default: a first-time visitor gets it whatever prefers-color-scheme
    // says, and only a previous explicit choice overrides it. The saved value
    // is checked against the three known modes, so a stale entry falls back
    // rather than leaving the page unstyled.
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = ["light", "dark", "wave"].indexOf(saved) >= 0 ? saved : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
</head>
<body>
  <a class="corner-link" href="./about.html">About</a>
  <button id="themeToggle" class="theme-toggle" type="button" title="Switch theme: light, dark, wave"></button>

  <!-- Wave mode's drifting scrollwork. Empty in the other two themes, which
       leave it display:none; the two bands are one tile at different scales
       and speeds. Decorative, hence aria-hidden. -->
  <div class="wave-field" aria-hidden="true">
    <div class="wave-band wave-band--near"></div>
    <div class="wave-band wave-band--far"></div>
  </div>

  <main class="portal">
    <h1 class="wordmark">Sāgarasaṅgama</h1>
    <!-- The compound's two members, coloured rather than hyphenated: sagara
         (ocean) and sangama (meeting). No separator character, so the word
         stays orthographically intact. -->
    <p class="devanagari"><span class="dev-a">सागर</span><span class="dev-b">सङ्गमः</span></p>
    <!-- The break is a phrase boundary, so the line divides where the sense
         does; below 720px it is shown, above it collapses to a space.
         The total rides along as a parenthetical rather than taking a line of
         its own below the constellation: it is a fact ABOUT the collections
         the tagline just named, and saying it here costs no vertical space.
         #totalTexts is still filled by counts.js -- same element id, same
         source, one line higher up the page. -->
    <p class="tagline">A virtual meeting of oceans for<br class="tagline-break" />
      large Sanskrit e-text collections
      <span class="tagline-total">(<strong id="totalTexts"></strong> texts)</span></p>

    <div class="constellation">
      <!-- 12 o'clock -->
      <div class="atlas atlas--top" data-slug="sanskrit-wikisource-atlas">
        <div class="atlas-links">
          <a class="atlas-name" href="https://tylergneill.github.io/sanskrit-wikisource-atlas" target="_blank" rel="noopener">Sanskrit Wikisource Atlas</a>
          <a class="atlas-source" href="https://sa.wikisource.org" target="_blank" rel="noopener"
             title="sa.wikisource.org" aria-label="sa.wikisource.org">.org</a>
        </div>
        <div class="atlas-meta">
          <span class="atlas-count"></span>
          <span class="atlas-date"></span>
        </div>
      </div>

      <!-- logo: five teardrops converging on a centre, one per Atlas, each
           pointing roughly at its card (12, 2:30, 5, 7 and 9:30 o'clock).
           Generated by `make logo` into assets/ -- do not hand-edit. -->
      <img class="logo" src="./assets/logo.svg"
           alt="Sāgarasaṅgama logo: five teardrops meeting at a centre" />

      <!-- 4 o'clock -->
      <div class="atlas atlas--right" data-slug="sanskrit-documents-atlas">
        <div class="atlas-links">
          <a class="atlas-name" href="https://tylergneill.github.io/sanskrit-documents-atlas" target="_blank" rel="noopener">Sanskrit Documents Atlas</a>
          <a class="atlas-source" href="https://sanskritdocuments.org" target="_blank" rel="noopener"
             title="sanskritdocuments.org" aria-label="sanskritdocuments.org">.org</a>
        </div>
        <div class="atlas-meta">
          <span class="atlas-count"></span>
          <span class="atlas-date"></span>
        </div>
      </div>

      <!-- 8 o'clock -->
      <div class="atlas atlas--left" data-slug="e-bharatisampat-atlas">
        <div class="atlas-links">
          <a class="atlas-name" href="https://tylergneill.github.io/e-bharatisampat-atlas" target="_blank" rel="noopener">E-bhāratīsampat Atlas</a>
          <a class="atlas-source" href="https://ebharatisampat.in" target="_blank" rel="noopener"
             title="ebharatisampat.in" aria-label="ebharatisampat.in">.in</a>
        </div>
        <div class="atlas-meta">
          <span class="atlas-count"></span>
          <span class="atlas-date"></span>
        </div>
      </div>

      <!-- 7 o'clock -->
      <div class="atlas atlas--bottom-left" data-slug="jain-quantum-atlas">
        <div class="atlas-links">
          <a class="atlas-name" href="https://tylergneill.github.io/jain-quantum-atlas" target="_blank" rel="noopener">Jain Quantum Atlas</a>
          <a class="atlas-source" href="https://jainqq.org" target="_blank" rel="noopener"
             title="jainqq.org" aria-label="jainqq.org">.org</a>
        </div>
        <div class="atlas-meta">
          <span class="atlas-count"></span>
          <span class="atlas-date"></span>
        </div>
      </div>

      <!-- 5 o'clock -->
      <div class="atlas atlas--bottom-right" data-slug="gretil-atlas">
        <div class="atlas-links">
          <a class="atlas-name" href="https://tylergneill.github.io/gretil-atlas" target="_blank" rel="noopener">GRETIL Atlas</a>
          <a class="atlas-source" href="https://tylergneill.github.io/gretil-mirror/gretil.html" target="_blank" rel="noopener"
             title="gretil.sub.uni-goettingen.de (mirror)" aria-label="GRETIL mirror">.de</a>
        </div>
        <div class="atlas-meta">
          <span class="atlas-count"></span>
          <span class="atlas-date"></span>
        </div>
      </div>
    </div>

    <!-- The way in to the federated search, placed as Wikipedia places its
         own: below the mark and below the per-collection counts, so the page
         reads logo -> what is here -> how to look through it. A real form, so
         it works without JS and so Enter submits: search.html reads ?q= on
         load, the same parameter its own box writes as you type. -->
    <form class="portal-search" action="./search.html" method="get" role="search">
      <span class="portal-search-icon" aria-hidden="true"></span>
      <input type="search" name="q" class="portal-search-input"
             aria-label="Search titles across all five collections"
             autocomplete="off" spellcheck="false" />
      <button type="submit" class="portal-search-go">Search</button>
    </form>
  </main>

  <script src="./theme.js"></script>
  <script src="./counts.js"></script>
  <script src="./local-links.js"></script>
</body>
</html>
