<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search · Sāgarasaṅgama</title>
  <meta name="description" content="Search titles across all three Sanskrit e-text Atlases at once." />
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="./assets/fonts/tiro-devanagari-sanskrit-latin.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="./assets/fonts/tiro-devanagari-sanskrit-latin-ext.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin
        href="./assets/fonts/tiro-devanagari-sanskrit-devanagari.woff2" />
  <!-- The index is the page's whole reason to exist, so it is fetched in
       parallel with the stylesheet rather than after search.js parses. -->
  <link rel="preload" as="fetch" type="application/json" crossorigin
        href="./data/search.json" />
  <link rel="stylesheet" href="./styles.css" />
  <script>
    // Before first paint, or the page flashes the wrong theme. Same three
    // modes and the same light default as index.html.
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = ["light", "dark", "wave"].indexOf(saved) >= 0 ? saved : "light";
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <!-- Sanscript, as the three Atlases load it: the query is transliterated to
       Devanagari so typing IAST finds a Devanagari title. Failing to load
       degrades to literal matching rather than breaking the page. -->
  <script src="https://cdn.jsdelivr.net/npm/@indic-transliteration/sanscript@1.3.3/sanscript.min.js"></script>
</head>
<body class="searchPage">

  <div class="wave-field" aria-hidden="true">
    <div class="wave-band wave-band--near"></div>
    <div class="wave-band wave-band--far"></div>
  </div>

  <header class="s-topbar">
    <div class="s-brand">
      <a class="s-home" href="./index.html" title="Back to Sāgarasaṅgama">Sāgarasaṅgama</a>
      <span class="s-crumb">search</span>
    </div>

    <div class="s-searchWrap">
      <span class="s-searchIcon" aria-hidden="true"></span>
      <input type="search" id="q" class="s-search" autocomplete="off"
             spellcheck="false" placeholder="Search titles across three collections…"
             aria-label="Search titles" />
      <button id="qClear" class="s-clear" type="button" hidden
              title="Clear the search" aria-label="Clear the search">×</button>
    </div>

    <nav class="s-nav">
      <!-- Beside the box it changes the meaning of, not down among the result
           filters. Off by default and not remembered between visits: it finds
           "Vadidevsuri" from "Vādidevasūri" by ignoring short a and the
           Hindi-style digraphs, and so also finds things nobody meant. -->
      <label class="s-toggle"
             title="Also match loosely spelled names and titles: short a ignored, sh/ch/w/gy and ri/ru folded, so “Vādidevasūri” finds “Vadidevsuri”. Loose matches are listed after the exact ones.">
        <input type="checkbox" id="fuzzySpelling" />
        <span>fuzzy spelling</span>
      </label>
      <span class="s-sep">|</span>
      <label class="s-navlabel" for="scheme">अ→a</label>
      <select id="scheme" class="s-select" aria-label="Transliteration scheme">
        <option value="devanagari">देवनागरी</option>
        <option value="iast" selected>IAST</option>
        <option value="itrans">ITRANS</option>
        <option value="hk">HK</option>
        <option value="iso">ISO 15919</option>
        <option value="slp1">SLP1</option>
      </select>
      <span class="s-sep">|</span>
      <button id="themeToggle" class="theme-toggle" type="button"
              title="Switch theme: light, dark, wave"></button>
    </nav>
  </header>

  <main class="s-main">
    <div class="s-controls">
      <div class="s-controlRow">
        <label class="s-toggle" title="Group the results under a heading per collection, instead of one ranked list">
          <input type="checkbox" id="groupByAtlas" />
          <span>group by atlas</span>
        </label>

        <!-- Grouping by the Atlases' own categories. The depth control is not
             cosmetic: wikisource's tree runs five levels deep, so grouping at
             full depth makes hundreds of small headings, while depth 1 makes a
             handful of broad ones. 1 / 2 / all lets the reader pick. -->
        <label class="s-toggle" title="Within each collection, split the results by that Atlas's own categories. Turns on grouping by collection too, since a category belongs to one Atlas.">
          <input type="checkbox" id="groupByCategory" />
          <span>group by category</span>
        </label>
        <span class="s-depth" id="catDepthWrap" role="group" aria-label="Category nesting depth">
          <span class="s-depthLabel">depth</span>
          <button type="button" class="s-depthBtn" data-depth="1">1</button>
          <button type="button" class="s-depthBtn" data-depth="2">2</button>
          <button type="button" class="s-depthBtn" data-depth="0">all</button>
        </span>

        <span class="s-sep s-sep-wide">|</span>

        <!-- One chip per collection: both a legend for the result tinting and
             a filter. The colours are the About page's growth-chart series. -->
        <span class="s-chips" id="atlasChips" role="group" aria-label="Filter by collection"></span>

        <span class="s-sep s-sep-wide">|</span>

        <label class="s-toggle" id="pdfOnlyWrap"
               title="Entries with no text to read: mostly E-bhāratīsampat's PDF-only books, plus Jain Quantum books without a public text, Wikisource items still image-only, and a few empty Sanskrit Documents pages. They are left out until you ask for them, so the default counts match the totals the home page publishes.">
          <input type="checkbox" id="showPdfOnly" />
          <span>also show PDFs with no text</span>
        </label>
      </div>

      <p class="s-status" id="status" role="status" aria-live="polite">Loading the index…</p>
    </div>

    <section id="results" class="s-results" aria-label="Search results"></section>

    <div class="s-more">
      <button id="moreBtn" class="s-moreBtn" type="button" hidden>Show more</button>
    </div>
  </main>

  <footer class="s-footer">
    <nav class="bottom-links">
      <a href="./index.html">Home</a>
      <span class="sep">·</span>
      <a href="./about.html">About</a>
      <span class="sep">·</span>
      <a href="https://github.com/tylergneill/sagara-sangama" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <p class="s-footnote" id="provenance"></p>
  </footer>

  <script src="./theme.js"></script>
  <script src="./search.js"></script>
  <script src="./local-links.js"></script>
</body>
</html>
